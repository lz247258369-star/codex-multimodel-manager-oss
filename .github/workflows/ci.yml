name: Development Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development-gate:
    name: development-gate
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The LR-14 scope validator reviews the committed branch delta
          # (merge-base of origin/main and HEAD), so the base ref must be
          # present in the checkout - also for the detached-HEAD pull_request
          # checkout shape.
          fetch-depth: 0

      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable | Format-List

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: local-router/**/packages.lock.json

      - name: Restore Local Router
        shell: pwsh
        run: dotnet restore local-router/LocalRouter.sln

      - name: Build Local Router
        shell: pwsh
        run: dotnet build local-router/LocalRouter.sln --configuration Release --no-restore

      - name: PR10A focused Host and native startup regression
        id: startup-regression
        shell: pwsh
        run: |
          # Reuse Release outputs. These three cases reuse the original READY,
          # STARTING cancellation and clean shutdown assertions; none is skipped
          # by the full suite below. Run native attacks even if smoke tests fail
          # so the same CI provides both refusal and filesystem evidence.
          dotnet test local-router/tests/Router.Core.Tests/Router.Core.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~HostStartupGateSmokeTests' --logger 'console;verbosity=normal'
          $smokeExit = $LASTEXITCODE
          $nativeLog = Join-Path $env:RUNNER_TEMP 'pr10a-fix2-native.log'
          ./tests/validate-router-host-startup-gate.ps1 -RepositoryRoot $PWD -UseExistingBuild *> $nativeLog
          $nativeExit = $LASTEXITCODE
          $nativeText = Get-Content -LiteralPath $nativeLog -Raw
          Write-Host $nativeText
          $nativePassed = $nativeText -match '(?m)^STARTUP_GATE_NATIVE PASS(?:\s|$)'
          if ($smokeExit -ne 0 -or $nativeExit -ne 0 -or -not $nativePassed) { throw "PR10A focused regression failed: smoke=$smokeExit native=$nativeExit nativeMarker=$nativePassed" }

      - name: Test Local Router
        id: router-tests
        # A focused failure must still produce full-suite evidence and remain
        # a failed job; do not use continue-on-error or suppress the failure.
        if: ${{ !cancelled() && steps.startup-regression.outcome != 'skipped' }}
        shell: pwsh
        run: dotnet test local-router/LocalRouter.sln --configuration Release --no-build

      - name: Run repository validation
        if: ${{ !cancelled() && steps.router-tests.outcome == 'success' }}
        shell: pwsh
        run: ./tests/validate-repo.ps1 -RepositoryRoot $PWD

      - name: Run Local Router architecture validation
        shell: pwsh
        run: ./tests/validate-local-router-architecture.ps1 -RepositoryRoot $PWD

      - name: Run Local Router ingress validation
        shell: pwsh
        run: ./tests/validate-local-router-ingress.ps1 -RepositoryRoot $PWD

      - name: Run Local Router registries validation
        shell: pwsh
        run: ./tests/validate-local-router-registries.ps1 -RepositoryRoot $PWD

      - name: Run Local Router provider harness validation
        shell: pwsh
        run: ./tests/validate-local-router-provider.ps1 -RepositoryRoot $PWD

      - name: Run Local Router OpenRouter adapter validation
        shell: pwsh
        run: ./tests/validate-local-router-openrouter.ps1 -RepositoryRoot $PWD

      - name: Run Local Router Model Studio adapter validation
        shell: pwsh
        run: ./tests/validate-local-router-modelstudio.ps1 -RepositoryRoot $PWD

      - name: Run Local Router OpenAI API adapter validation
        shell: pwsh
        run: ./tests/validate-local-router-openai.ps1 -RepositoryRoot $PWD

      - name: Run Local Router Xiaomi MiMo adapter validation
        shell: pwsh
        run: ./tests/validate-local-router-mimo.ps1 -RepositoryRoot $PWD

      - name: Run Local Router DeepSeek direct adapter validation
        shell: pwsh
        run: ./tests/validate-local-router-deepseek.ps1 -RepositoryRoot $PWD

      - name: Run DeepSeek direct router bootstrap validation
        shell: pwsh
        run: ./tests/validate-deepseek-router-bootstrap.ps1 -RepositoryRoot $PWD

      - name: Run DeepSeek secret bridge validation
        shell: pwsh
        run: ./tests/validate-deepseek-secret-bridge.ps1 -RepositoryRoot $PWD

      - name: Run registry-only model approval validation
        shell: pwsh
        run: ./tests/validate-model-approval-registry-only.ps1 -RepositoryRoot $PWD

      - name: Run Local Router production startup validation
        shell: pwsh
        run: ./tests/validate-local-router-production-startup.ps1 -RepositoryRoot $PWD

      - name: Run Router control-plane bootstrap validation
        shell: pwsh
        run: ./tests/validate-router-control-plane-bootstrap.ps1 -RepositoryRoot $PWD

      - name: Run DSR7-C capability diagnostic validation
        shell: pwsh
        run: ./tests/validate-dsr7c-capability-diagnostic.ps1 -RepositoryRoot $PWD

      - name: Run DSR7-C safe failure diagnostic validation
        shell: pwsh
