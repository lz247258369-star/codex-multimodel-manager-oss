      - name: Run Responses upstream tool_choice wire validation
        shell: pwsh
        run: ./tests/validate-responses-upstream-tool-choice-wire.ps1 -RepositoryRoot $PWD

      - name: Run DSR7-C apply_patch request bridge validation
        shell: pwsh
        run: ./tests/validate-dsr7c-apply-patch-request-bridge.ps1 -RepositoryRoot $PWD

      - name: Run DSR7-C apply_patch response bridge validation
        shell: pwsh
