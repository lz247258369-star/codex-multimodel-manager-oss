      - name: Run Local Router Codex Desktop adapter validation
        shell: pwsh
        run: ./tests/validate-local-router-codex-desktop.ps1 -RepositoryRoot $PWD

      - name: Run Local Router LR-13 scope validation
        shell: pwsh
        run: ./tests/validate-local-router-lr13-scope.ps1 -RepositoryRoot $PWD

      - name: Run Local Router production execution composition validation
        shell: pwsh
        run: ./tests/validate-local-router-execution-composition.ps1 -RepositoryRoot $PWD

      - name: Run Local Router LR-14P control-plane validation
        shell: pwsh
        run: ./tests/validate-local-router-lr14p-control-plane.ps1 -RepositoryRoot $PWD

      - name: Run Local Router V4 UI validation
        shell: pwsh
        run: ./tests/validate-local-router-v4-ui.ps1 -RepositoryRoot $PWD

      - name: Run Local Router bootstrap validation
        shell: pwsh
        run: ./tests/validate-local-router-bootstrap.ps1 -RepositoryRoot $PWD

      # Runs after restore/build/test on purpose: those steps rewrite tracked
      # local-router packages.lock.json files in the worktree, and the scope
      # decision must stay a committed-delta decision that ignores that noise.
      - name: Run Local Router LR-14 scope validation
        shell: pwsh
        run: ./tests/validate-local-router-lr14-scope.ps1 -RepositoryRoot $PWD

      - name: Run Local Router LR-14 scope regression validation
        shell: pwsh
        run: ./tests/validate-local-router-lr14-scope-regression.ps1 -RepositoryRoot $PWD

      - name: Run Local Router HS1B-RB1 scope validation
        shell: pwsh
        run: ./tests/validate-local-router-hs1b-rb1-scope.ps1 -RepositoryRoot $PWD

      - name: Run PowerShell runtime validation
        shell: pwsh
        run: ./tests/validate-powershell-runtime.ps1 -RepositoryRoot $PWD

      - name: Run runtime regression validation
        shell: pwsh
        run: ./tests/validate-runtime-regressions.ps1 -RepositoryRoot $PWD

      - name: Run Codex Profile V2 migration validation
        shell: pwsh
        run: ./tests/validate-profile-v2.ps1 -RepositoryRoot $PWD

      - name: Run health-check validation
